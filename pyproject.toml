[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "gdatlas"
version = "0.0.1"
description = "A Godot codebase comprehension and visualization tool."
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.10"
authors = [
    { name = "Wikpi" },
]
keywords = ["godot-analyze"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []
[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
gdatlas = "gdatlas.__main__:main"

[project.urls]
Homepage = "https://github.com/Wikpi/gdatlas"
Issues = "https://github.com/Wikpi/gdatlas/issues"

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Get Current Changes
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            **/*.py

      - name: Ruff version
        run:
          ruff --version

      # --- Blocking: changed Python files ---
      - name: Lint (changed files)
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          ruff check ${{ steps.changed-files.outputs.all_changed_files }}

      - name: Check formatting (changed files)
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          ruff format --check ${{ steps.changed-files.outputs.all_changed_files }}

      - name: Run tests
        run: |
          pytest

      # --- Non-blocking: whole project ---
      - name: Lint (full)
        continue-on-error: true
        run: |
          ruff check .

      - name: Check formatting (full)
        continue-on-error: true
        run: |
          ruff format --check .
